{% extends 'report_base.html' %}{% block title %}Prepare analysis{% endblock %}{% block content %}<h1>Movie Review Analysis</h1><section class="card"><p id="progress" role="status">Select a video from the dashboard, or import a completed Colab report.</p><a id="import-link" href="{{ url_for('reports.library') }}">Import Colab Report / Saved Reports →</a></section>
<script>const u=new URLSearchParams(location.search).get('url'),p=document.getElementById('progress');if(u){p.textContent='Preparing your video. Please keep this page open…';const source=new EventSource('/api/analyze?url='+encodeURIComponent(u));source.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.status==='progress')p.textContent='Preparing your video for analysis…';if(d.status==='completed'){source.close();if(d.db_analysis_id){document.getElementById('import-link').href='/reports?analysis_id='+encodeURIComponent(d.db_analysis_id);}p.textContent='Preparation complete. Run your prepared files in Colab, then import the final report here.';}if(d.status==='error'){source.close();p.textContent='Preparation could not be completed. Please try again.';}}catch{source.close();p.textContent='Unable to read progress. Please try again.';}};source.onerror=()=>{source.close();p.textContent='Connection interrupted. Please return to the dashboard and try again.';};}</script>{% endblock %}
