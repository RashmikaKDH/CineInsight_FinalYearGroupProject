<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Debugger — CineInsight</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #eab308;
            --border: #334155;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
        p.subtitle { color: var(--text-muted); font-size: 1.1rem; }

        .search-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
        }

        input {
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: white;
            width: 400px;
            outline: none;
        }
        
        input:focus { border-color: var(--accent); }

        button {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: white;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:disabled { background: var(--text-muted); cursor: not-allowed; }

        .loader {
            display: none;
            text-align: center;
            color: var(--warning);
            font-weight: 600;
            margin-bottom: 2rem;
        }

        .results-container {
            display: grid;
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .video-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .video-card.accepted { border-left: 6px solid var(--success); }
        .video-card.rejected { border-left: 6px solid var(--danger); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .card-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.25rem; }
        .card-channel { color: var(--text-muted); font-size: 0.9rem; }
        .card-id { font-family: monospace; background: #000; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.85rem;}

        .layers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }

        .layer-box {
            background: rgba(0,0,0,0.2);
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .layer-title { font-weight: 600; margin-bottom: 0.5rem; color: var(--text-muted); }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge.pass { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        .badge.fail { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .badge.neutral { background: rgba(148, 163, 184, 0.2); color: var(--text-muted); }
        .badge.auto { background: rgba(234, 179, 8, 0.2); color: var(--warning); }
        
        .reason { margin-top: 0.5rem; font-size: 0.85rem; color: #cbd5e1; }

        .transcript-box {
            background: #000;
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #a7f3d0;
            white-space: pre-wrap;
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/favicon.svg') }}">
</head>
<body>

    <header>
        <h1>Live Pipeline Debugger</h1>
        <p class="subtitle">Trace the latest search from your main app</p>
    </header>

    <div class="search-container">
        <button id="searchBtn" onclick="runTrace()">Load Latest Trace</button>
    </div>

    <div class="loader" id="loader">Loading trace...</div>
    
    <div id="stats" style="text-align: center; margin-bottom: 1rem; font-weight: 600;"></div>
    <div class="results-container" id="results"></div>

    <script>
        async function runTrace() {
            const btn = document.getElementById('searchBtn');
            const loader = document.getElementById('loader');
            const resultsDiv = document.getElementById('results');
            const statsDiv = document.getElementById('stats');

            btn.disabled = true;
            loader.style.display = 'block';
            resultsDiv.innerHTML = '';
            statsDiv.innerHTML = '';

            try {
                const response = await fetch(`/api/debug-search`);
                const data = await response.json();

                if (data.error) {
                    alert("Error: " + data.error);
                    return;
                }

                document.querySelector('.subtitle').innerHTML = `Showing trace for: <strong>"${data.query}"</strong>`;

                const trace = data.trace || [];
                let accepted = 0, rejected = 0;

                trace.forEach(v => {
                    if(v.final_status === 'accepted') accepted++;
                    else rejected++;

                    const card = document.createElement('div');
                    card.className = `video-card ${v.final_status}`;

                    const getBadge = (pass) => {
                        if(pass === null) return `<span class="badge neutral">SKIPPED</span>`;
                        return pass ? `<span class="badge pass">PASS</span>` : `<span class="badge fail">FAIL</span>`;
                    };

                    const getSubBadge = (status) => {
                        if(status === 'manual') return `<span class="badge pass">MANUAL</span>`;
                        if(status === 'auto') return `<span class="badge auto">AUTO</span>`;
                        if(status === 'none' || status === 'error') return `<span class="badge fail">NONE</span>`;
                        return `<span class="badge neutral">SKIPPED</span>`;
                    };

                    card.innerHTML = `
                        <div class="card-header">
                            <div>
                                <div class="card-title">${v.title}</div>
                                <div class="card-channel">${v.channel}</div>
                            </div>
                            <div class="card-id">${v.video_id}</div>
                        </div>

                        <div class="layers-grid">
                            <div class="layer-box">
                                <div class="layer-title">Layer 1: Title Filter</div>
                                ${getBadge(v.layer1_title_pass)}
                                <div class="reason">${v.layer1_reason || ''}</div>
                            </div>
                            
                            <div class="layer-box">
                                <div class="layer-title">Layer 2: Audio Filter</div>
                                ${getBadge(v.layer2_audio_pass)}
                                <div class="reason">${v.layer2_reason || ''}</div>
                            </div>

                            <div class="layer-box">
                                <div class="layer-title">Layer 3: Content Filter</div>
                                ${getBadge(v.layer3_content_pass)}
                                <div class="reason">${v.layer3_reason || ''}</div>
                            </div>

                            <div class="layer-box">
                                <div class="layer-title">Subtitle Download</div>
                                ${getSubBadge(v.subtitle_status)}
                                <div class="reason">yt-dlp VTT extraction</div>
                            </div>

                            <div class="layer-box" style="grid-column: 1 / -1;">
                                <div class="layer-title">Layer 4: fastText ML Model</div>
                                ${getBadge(v.layer4_lang_pass)}
                                <div class="reason">
                                    Detected Language: <strong>${v.layer4_detected_lang || 'N/A'}</strong> <br>
                                    Confidence Score: <strong>${(v.layer4_score * 100).toFixed(2)}%</strong>
                                </div>
                                ${v.transcript_snippet ? `
                                    <div class="layer-title" style="margin-top: 1rem;">Transcript Sent to Model (first 500 chars):</div>
                                    <div class="transcript-box">${v.transcript_snippet}</div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                    resultsDiv.appendChild(card);
                });

                statsDiv.innerHTML = `Videos Processed: ${trace.length} | <span style="color:var(--success)">Accepted: ${accepted}</span> | <span style="color:var(--danger)">Rejected: ${rejected}</span>`;

            } catch (err) {
                console.error(err);
                alert("Failed to fetch debug trace.");
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
