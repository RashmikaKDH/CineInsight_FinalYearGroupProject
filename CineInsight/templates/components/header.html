<header class="dashboard-header">
    <div class="header-container">
        <!-- Logo -->
        <a href="/" class="logo-container" aria-label="CineInsight Home">
            <svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="logo-icon">
                <rect width="40" height="40" rx="8" fill="#E35614" />
                <path d="M8 14H32" stroke="white" stroke-width="2.5" stroke-linecap="round" />
                <path d="M11 9L14 14" stroke="white" stroke-width="2" stroke-linecap="round" />
                <path d="M18 9L21 14" stroke="white" stroke-width="2" stroke-linecap="round" />
                <path d="M25 9L28 14" stroke="white" stroke-width="2" stroke-linecap="round" />
                <path d="M8 9H32" stroke="white" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span class="logo-text">CineInsight</span>
        </a>

        <!-- Center badge for admin -->
        {% if active_page == 'admin' %}
        <div class="header-center-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            Admin Panel
        </div>
        {% endif %}

        <!-- Navigation Links -->
        <nav class="header-nav" aria-label="Page navigation">
            <a href="/dashboard" class="header-nav-link {% if active_page == 'dashboard' or active_page == 'analysis' %}active{% endif %}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                </svg>
                <span>Dashboard</span>
            </a>
            <a href="/reports" class="header-nav-link {% if active_page == 'reports' or active_page == 'results' %}active{% endif %}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
                <span>Reports</span>
            </a>
        </nav>

        <!-- User Panel -->
        {% include 'components/account_panel.html' %}
    </div>
</header>
